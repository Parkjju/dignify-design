<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dignify 시안">
<title>Dignify 시안</title>
<!-- 휴대폰에서 시안을 화면 가득 여는 목록. 스토리 목록은 index.json에서 읽으니 새 화면·흐름이 생기면 자동으로 뜬다 -->
<style>
  :root { --brand: #4B3FD8; --text: #111827; --sub: #6B7280; --line: #E5E7EB; --bg: #F9FAFB; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; color: var(--text); background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px); -webkit-font-smoothing: antialiased; }
  h1 { font-size: 24px; font-weight: 700; }
  .hint { color: var(--sub); font-size: 13px; margin-top: 6px; }
  label { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding: 14px 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  input { width: 20px; height: 20px; accent-color: var(--brand); }
  h2 { font-size: 13px; font-weight: 600; color: var(--sub); margin: 24px 4px 8px; }
  ul { list-style: none; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  a { display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 12px 16px; color: inherit; text-decoration: none; }
  a:active { background: #F3F4F6; }
  a::after { content: "›"; color: #9CA3AF; font-size: 20px; }
  .err { color: #DC2626; margin-top: 16px; }
</style>
</head>
<body>
<h1>Dignify 시안</h1>
<p class="hint">흐름: 오른쪽 탭 = 다음, 왼쪽 탭 = 이전 · <b>길게 누르면 이 목록으로</b></p>
<label>가짜 상태바 보이기 <input type="checkbox" id="mock"></label>
<div id="list"></div>
<script>
  const mock = document.getElementById('mock')
  try { mock.checked = localStorage.getItem('mockStatus') === '1' } catch {}
  const href = id => `iframe.html?id=${encodeURIComponent(id)}&viewMode=story&globals=fullscreen:!true;mockStatus:!${mock.checked}`
  const groups = [['직접 해 보기', e => e.id.endsWith('--coach-live')], ['흐름', e => e.title === 'Flows'], ['화면', e => e.title.startsWith('Screens/') && !e.id.endsWith('--coach-live')]]
  let entries = []
  const render = () => {
    document.getElementById('list').innerHTML = groups.map(([name, f]) => {
      const items = entries.filter(f)
      return items.length ? `<h2>${name}</h2><ul>${items.map(e => `<li><a href="${href(e.id)}">${e.title.startsWith('Screens/') ? e.title.slice(8) + ' · ' : ''}${e.name}</a></li>`).join('')}</ul>` : ''
    }).join('')
  }
  mock.onchange = () => { try { localStorage.setItem('mockStatus', mock.checked ? '1' : '0') } catch {} render() }
  fetch('index.json').then(r => r.json()).then(j => { entries = Object.values(j.entries).filter(e => e.type === 'story'); render() })
    .catch(() => { document.getElementById('list').innerHTML = '<p class="err">목록을 불러오지 못했어요. 맥에서 npm run dev가 켜져 있는지 확인해 주세요.</p>' })
</script>
</body>
</html>
