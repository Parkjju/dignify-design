# main에 머지되면 Storybook을 GitHub Pages로 배포한다. PR에서는 빌드·생성물 검사만.
name: Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 토큰·생성물이 최신인지 (tokens 고치고 build 안 돌렸으면 실패)
        run: npm run check
      - run: npx storybook build -o storybook-static --quiet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
