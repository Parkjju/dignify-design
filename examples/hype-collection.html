<!doctype html>
<!-- 예제: 마이 → 디깅 프로필의 담은 곡. iOS DiggingProfileView · HypeCollection 실측값.
     값 규칙: 토큰이 있으면 토큰, 없으면 앱 코드 실측값 + 출처 주석. 아트워크는 그라데이션 자리표시.
     id가 tokens인 style 블록은 node scripts/build.mjs가 채운다. 직접 고치지 말 것. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 — 담은 곡</title>
<style id="tokens">
/* 자동 생성 파일 — 직접 고치지 말 것. 정본: dignify-design/tokens */
:root {
  --color-brand: #4B3FD8;
  --color-brand-light: #EEF0FF;
  --color-brand-deep: #2A2350;
  --color-background: #FFFFFF;
  --color-surface: #F3F4F6;
  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-border: #D1D5DB;
  --color-border-light: #E5E7EB;
  --color-divider: #F3F4F6;
  --color-destructive: #EF4444;
  --color-pick-background: #141420;
  --color-pick-surface: #1E1E2A;
  --color-pick-elevated: #282836;
  --color-pick-accent: #8F86FF;
  --typography-display: 700 40px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-title1: 700 24px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-title2: 700 18px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-headline: 600 17px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-body: 400 15px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-body-medium: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-callout: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-label: 600 13px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-caption: 400 12px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-caption-strong: 600 12px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-micro: 400 10.5px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-title: var(--typography-title1);
  --radius-small: 12px;
  --radius-medium: 16px;
  --radius-large: 24px;
  --radius-extra-large: 28px;
  --radius-full: 999px;
  --spacing-x0-5: 2px;
  --spacing-x1: 4px;
  --spacing-x1-5: 6px;
  --spacing-x2: 8px;
  --spacing-x2-5: 10px;
  --spacing-x3: 12px;
  --spacing-x3-5: 14px;
  --spacing-x4: 16px;
  --spacing-x5: 20px;
  --spacing-x6: 24px;
  --spacing-x8: 32px;
  --spacing-x10: 40px;
}
</style>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #E9E9EE; display: flex; justify-content: center; padding: var(--spacing-x6) 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  .device { position: relative; width: 393px; height: 852px; border-radius: 55px; overflow: hidden; background: var(--color-background); box-shadow: 0 0 0 10px #111; }
  .status { position: absolute; inset: 0 0 auto; height: 59px; display: flex; justify-content: space-between; align-items: center; padding: 6px 32px 0; color: var(--color-text-primary); font-weight: 600; font-size: 16px; z-index: 5; }

  /* 내비: inline 타이틀 + 떠 있는 원형 뒤로가기 (시스템 NavigationStack) */
  .nav { position: absolute; top: 59px; inset-inline: 0; height: 56px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--color-divider); }
  .nav h1 { font: var(--typography-headline); color: var(--color-text-primary); }
  .back { position: absolute; left: var(--spacing-x4); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.9);
    box-shadow: 0 2px 10px rgba(0,0,0,.12); display: grid; place-items: center; color: var(--color-text-primary); }
  .back svg { width: 20px; height: 20px; }
  .content { position: absolute; inset: calc(59px + 56px) 0 0; padding-top: var(--spacing-x4); }

  .sec { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--spacing-x5); margin-bottom: var(--spacing-x3); }
  .sec h2 { font: var(--typography-title2); color: var(--color-text-primary); }
  .sec a { font-size: 15px; font-weight: 500; color: var(--color-brand); }

  /* 날짜 묶음: 헤더 13 semibold textTertiary, 가로 스크롤 셀 72, 간격 12 (HypeCollection.DayRow) */
  .day { margin-bottom: var(--spacing-x5); }
  .day h3 { font: var(--typography-label); color: var(--color-text-tertiary); padding: 0 var(--spacing-x5); margin-bottom: 2px; }
  .row { display: flex; gap: var(--spacing-x3); padding: var(--spacing-x1-5) var(--spacing-x5) 0; overflow: hidden; }
  .cell { width: 72px; flex: none; display: flex; flex-direction: column; gap: var(--spacing-x1-5); }
  .cell i { width: 72px; height: 72px; border-radius: var(--radius-medium); background: var(--art, var(--color-surface)); }
  .cell b { font-size: 11px; font-weight: 500; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell span { font-size: 10px; color: var(--color-text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: -4px; }

  .see-all { height: 44px; padding: 0 var(--spacing-x5); display: flex; align-items: center; justify-content: space-between; font: var(--typography-callout); color: var(--color-brand); }
  /* 공유 버튼: brand, radius 14 (DSPrimary와 다름 — 높이 15+15, 16 semibold) */
  .share-taste { margin: var(--spacing-x1) var(--spacing-x5) 0; padding: 15px 0; border-radius: 14px; background: var(--color-brand); color: #fff;
    font-size: 16px; font-weight: 600; text-align: center; }
  /* 탭바: 떠 있는 캡슐 (iOS 26 시스템 탭바, tint brand) */
  .tabbar { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); width: 300px; height: 62px; border-radius: var(--radius-full);
    display: flex; padding: 4px; backdrop-filter: blur(20px); z-index: 4; }
  .tabbar.light { background: rgba(255,255,255,.72); border: 1px solid rgba(0,0,0,.06); }
  .tabbar.dark { background: rgba(80,80,90,.55); border: 1px solid rgba(255,255,255,.12); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-full); font-size: 10px; font-weight: 600; }
  .tabbar.light .tab { color: var(--color-text-primary); }
  .tabbar.dark .tab { color: #fff; }
  .tab.on { color: var(--color-brand) !important; background: rgba(120,120,128,.18); }
  .tab svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="device">
  <div class="status"><span>10:21</span><span>97%</span></div>
  <header class="nav"><span class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span><h1>디깅 프로필</h1></header>
  <div class="content">
    <div class="sec"><h2>담은 곡</h2><a>편집</a></div>
    <div class="day"><h3>2026년 8월 24일</h3><div class="row"><div class="cell"><i style="--art:linear-gradient(135deg,#B3262B,#3B7A57)"></i><b>페어웰 투 암…</b><span>잔나비</span></div><div class="cell"><i style="--art:linear-gradient(135deg,#F3EFE8,#B08D57)"></i><b>FRIENDS (f…</b><span>shinjihang</span></div><div class="cell"><i style="--art:linear-gradient(135deg,#D9B77E,#C49A5A)"></i><b>Introductio…</b><span>윤상</span></div></div></div>
    <div class="day"><h3>2026년 8월 20일</h3><div class="row"><div class="cell"><i style="--art:#F26522"></i><b>Blame</b><span>creespy</span></div><div class="cell"><i style="--art:linear-gradient(135deg,#F5F5F5,#2B2B2B)"></i><b>100yen Kiss</b><span>LET ME KNOW</span></div></div></div>
    <div class="day"><h3>2026년 8월 19일</h3><div class="row"><div class="cell"><i style="--art:linear-gradient(135deg,#1E1A14,#7A4B22)"></i><b>Lonely Tow…</b><span>Bill Withers</span></div><div class="cell"><i style="--art:linear-gradient(135deg,#FFFFFF,#D7D7D7)"></i><b>Godspeed!</b><span>혁오</span></div></div></div>
    <div class="see-all"><span>하입 기록 전체 보기</span><span>›</span></div>
    <div class="share-taste">⇪ 내 취향 공유</div>
  </div>
    <nav class="tabbar light">
    <span class="tab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11.5h3V21h5v-6h4v6h5v-9.5h3z"/></svg>피드</span>
    <span class="tab"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="7" width="14" height="14" rx="3"/><rect x="7" y="3.5" width="10" height="2" rx="1"/></svg>픽</span>
    <span class="tab on"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>마이</span>
  </nav>
</div>
</body>
</html>
