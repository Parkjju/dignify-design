<!doctype html>
<!-- 예제: 검색 화면. 새 시안은 이 파일을 복사해 시작한다. 값은 토큰 변수로만 쓴다.
     id가 tokens인 style 블록은 node scripts/build.mjs가 채운다. 직접 고치지 말 것. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 — 검색</title>
<style id="tokens">
/* 자동 생성 파일 — 직접 고치지 말 것. 정본: dignify-design/tokens */
:root {
  --color-brand: #4B3FD8;
  --color-brand-light: #EEF0FF;
  --color-brand-deep: #2A2350;
  --color-background: #FFFFFF;
  --color-surface: #F3F4F6;
  --color-text-primary: #111827;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-border: #D1D5DB;
  --color-border-light: #E5E7EB;
  --color-divider: #F3F4F6;
  --color-destructive: #EF4444;
  --color-pick-background: #141420;
  --color-pick-surface: #1E1E2A;
  --color-pick-elevated: #282836;
  --color-pick-accent: #8F86FF;
  --typography-display: 700 40px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-title1: 700 24px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-title2: 700 18px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-headline: 600 17px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-body: 400 15px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-body-medium: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-callout: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-label: 600 13px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-caption: 400 12px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-caption-strong: 600 12px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-micro: 400 10.5px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --typography-title: var(--typography-title1);
  --radius-small: 12px;
  --radius-medium: 16px;
  --radius-large: 24px;
  --radius-extra-large: 28px;
  --radius-full: 999px;
  --spacing-x0-5: 2px;
  --spacing-x1: 4px;
  --spacing-x1-5: 6px;
  --spacing-x2: 8px;
  --spacing-x2-5: 10px;
  --spacing-x3: 12px;
  --spacing-x3-5: 14px;
  --spacing-x4: 16px;
  --spacing-x5: 20px;
  --spacing-x6: 24px;
  --spacing-x8: 32px;
  --spacing-x10: 40px;
}
</style>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--color-surface); display: flex; justify-content: center; padding: var(--spacing-x6) 0; }
  .device { width: 393px; min-height: 852px; background: var(--color-background); border-radius: var(--radius-extra-large); overflow: hidden; padding: var(--spacing-x5); }
  h1 { font: var(--typography-title1); color: var(--color-text-primary); margin-bottom: var(--spacing-x4); }

  /* components/search-bar.md */
  .search-bar { display: flex; align-items: center; gap: var(--spacing-x2); height: 40px; padding: 0 var(--spacing-x3-5);
    background: var(--color-surface); border: 1px solid var(--color-border-light); border-radius: var(--radius-medium); }
  .search-bar svg { width: 15px; height: 15px; color: var(--color-text-tertiary); }
  .search-bar input { flex: 1; border: 0; background: none; outline: none; font: var(--typography-body); font-size: 14px; color: var(--color-text-primary); caret-color: var(--color-brand); }
  .search-bar input::placeholder { color: var(--color-text-tertiary); }

  .section { font: var(--typography-label); color: var(--color-text-secondary); margin: var(--spacing-x6) 0 var(--spacing-x3); }
  .row { display: flex; align-items: center; gap: var(--spacing-x3); padding: var(--spacing-x2) 0; }
  .art { width: 48px; height: 48px; border-radius: var(--radius-small); background: var(--color-surface); }
  .title { font: var(--typography-body-medium); color: var(--color-text-primary); }
  .artist { font: var(--typography-caption); color: var(--color-text-secondary); }

  /* components/button.md — outline */
  .btn-outline { display: inline-flex; align-items: center; height: 40px; padding: 0 var(--spacing-x5); border: 1px solid var(--color-border);
    border-radius: var(--radius-full); background: none; font: var(--typography-callout); color: var(--color-text-primary); margin-top: var(--spacing-x4); }
</style>
</head>
<body>
<div class="device">
  <h1>검색</h1>
  <label class="search-bar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input placeholder="아티스트, 곡 검색">
  </label>

  <p class="section">최근 검색</p>
  <div class="row"><div class="art"></div><div><p class="title">곡 제목</p><p class="artist">아티스트</p></div></div>
  <div class="row"><div class="art"></div><div><p class="title">곡 제목</p><p class="artist">아티스트</p></div></div>

  <button class="btn-outline">아티스트 요청하기</button>
</div>
</body>
</html>
